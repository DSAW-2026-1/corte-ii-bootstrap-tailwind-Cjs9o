<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Stats preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    body {
      background-color: hsl(233, 47%, 7%);  display: flex;
      justify-content: center; align-items: center;
      min-height: 100vh; margin: 0;
    }
    nav {
      display: flex;
      gap: 200px;
    }
    nav a {
      color: white; text-decoration: none;
      padding: 50px; border: 2px solid hsl(277, 64%, 61%);
      border-radius: 5px; transition: 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 120px;
      text-align: center;
    }
    nav a:hover {
      background-color: hsl(277, 64%, 61%);
    }
    img{
      width: 100px;
    }
    @media (max-width: 768px) {
      nav {
        flex-direction: column;
        gap: 20px;
      }
      nav a {
        padding: 30px;
        width: 200px;
      }
    }
  </style>
</head>

\<body>
  <nav>
    <a href="./bootstrap.html">Bootstrap<img src="./images/bootstrap-stack-1.png"></a>
    <a href="./tailwind.html">Tailwind<img src="./images/Tailwind Crash Course"></a>
  </nav>
</body>
</html>
