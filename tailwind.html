<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Tailwind | Stats preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend+Deca&display=swap" rel="stylesheet">
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="bg-[hsl(233,47%,7%)] min-h-screen flex flex-col items-center justify-center p-6 font-['Inter']">
<main class="bg-[hsl(244,38%,16%)] max-w-[1110px] rounded-lg overflow-hidden flex flex-col-reverse lg:flex-row text-white">
    
    <div class="p-8 lg:p-16 lg:w-1/2 text-center lg:text-left">
      <h1 class="text-3xl lg:text-4xl font-bold mb-6">Get <span class="text-[hsl(277,64%,61%)]">insights</span> that help your business grow.</h1>
      <p class="text-[hsla(0,0%,100%,0.75)] mb-10 leading-relaxed">Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>
      
      <div class="flex flex-col lg:flex-row justify-between gap-6">
        <div>
          <h2 class="text-2xl font-bold">10k+</h2>
          <p class="uppercase text-xs tracking-widest text-[hsla(0,0%,100%,0.6)]">companies</p>
        </div>
        <div>
          <h2 class="text-2xl font-bold">314</h2>
          <p class="uppercase text-xs tracking-widest text-[hsla(0,0%,100%,0.6)]">templates</p>
        </div>
        <div>
          <h2 class="text-2xl font-bold">12m+</h2>
          <p class="uppercase text-xs tracking-widest text-[hsla(0,0%,100%,0.6)]">queries</p>
        </div>
      </div>
    </div>

    <div class="lg:w-1/2 bg-[hsl(277,64%,61%)] relative">
      <picture>
        <source srcset="./images/image-header-desktop.jpg" media="(min-width: 1024px)">
        <img src="./images/image-header-mobile.jpg" alt="People at work" class="w-full h-full object-cover opacity-75 mix-blend-multiply">
      </picture>
    </div>
  </main>

  <div class="attribution mt-8 text-white">
    Coded by <a href="#" class="text-[hsl(228,45%,44%)]">Camilo Andres Moncada Vasquez</a>.
  </div>
</body>
</html>
